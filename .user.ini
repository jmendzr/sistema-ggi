; GGI Sistema — Configuración PHP por directorio
; Aplica a PHP-FPM y LiteSpeed LSAPI (se recarga cada 5 min automáticamente)

; ── Sesión ────────────────────────────────────────────────────────────────────
; El sistema usa sesiones de 30 días. gc_maxlifetime DEBE ser igual o mayor
; para que el GC del servidor no elimine archivos de sesión activos.
session.gc_maxlifetime  = 2592000   ; 30 días (= SESSION_LIFETIME en config.php)
session.cookie_lifetime = 2592000   ; La cookie persiste 30 días en el navegador
session.gc_probability  = 1
session.gc_divisor      = 1000
session.cookie_httponly = 1
session.cookie_secure   = 1
session.use_strict_mode = 1

; ── OPcache ───────────────────────────────────────────────────────────────────
; El servidor tiene opcache.revalidate_freq=0 (comprueba cambios en cada petición).
; En producción los archivos no cambian entre peticiones, así que revalidar cada
; 60 s elimina miles de llamadas stat() innecesarias por día.
; Este ajuste es PHP_INI_ALL: válido en .user.ini para PHP-FPM y LiteSpeed LSAPI.
opcache.revalidate_freq = 60
